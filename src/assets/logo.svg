<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Edumotion logo</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b6fff"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#g)"/>
  <g transform="translate(20,24)" fill="#fff">
    <!-- E estilizada -->
    <rect x="0" y="0" width="56" height="10" rx="2"/>
    <rect x="0" y="20" width="40" height="10" rx="2"/>
    <rect x="0" y="40" width="56" height="10" rx="2"/>
    <!-- marca: círculo -->
    <circle cx="86" cy="30" r="18" fill="#ffffff20"/>
    <circle cx="86" cy="30" r="9" fill="#fff"/>
  </g>
</svg>